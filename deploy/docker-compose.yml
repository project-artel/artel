# ARTEL self-hosted stack. Needs Docker Compose 2.23.1 or later (the Caddy configuration below is inlined).
#
# Easiest: run install.sh, which saves this file and fills in the secrets below.
# By hand: save this file, replace every CHANGE_ME below (generate each with: openssl rand -hex 32),
# then run: docker compose up -d   and open the public URL. The first account to sign up becomes the admin;
# the admin page sets the OpenRouter key.
#
# This file holds secrets once you edit it. Do not commit it or share it. Back it up: if
# x-secrets-key is lost or changed, the OpenRouter key saved on the admin page cannot be read.
# The build sections only matter in a clone of the repository: `docker compose build orchestration agent-server`.

name: artel

# ---- Edit these. Each value is written once and used by the services that need it. ----
# Public URL of the console, no trailing slash. To change the host port or name, change the URL and the
# published ports of the proxy service (and the Caddy site addresses at the bottom) together.
x-public-url: &public_url http://localhost:8088
# URL of the admin page. Keep the same host name as the public URL so one login works on both.
x-admin-url: &admin_url http://localhost:8090
# Signs session tokens. At least 32 bytes: the server refuses to start with the placeholder.
x-jwt-secret: &jwt_secret CHANGE_ME
# Encrypts the OpenRouter key saved on the admin page. Never change it after first start.
x-secrets-key: &secrets_key CHANGE_ME
x-db-password: &db_password CHANGE_ME
# MinIO root user and password (object storage for uploads), at least 3 and 8 characters.
x-s3-access-key: &s3_access_key CHANGE_ME
x-s3-secret-key: &s3_secret_key CHANGE_ME
# Optional. A single OpenRouter key covers every model; the admin page can set it instead and wins.
x-openrouter-api-key: &openrouter_api_key ""

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    # Must be the pgvector image: a Flyway migration runs CREATE EXTENSION vector.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: artel
      POSTGRES_USER: artel
      POSTGRES_PASSWORD: *db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artel -d artel"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    <<: *restart
    # Holds only five-minute SDK login codes, so persistence stays off on purpose.
    # Valkey, not Redis: current Redis 7.x tags are RSALv2/SSPLv1, which does not fit an AGPL-3.0 release.
    image: valkey/valkey:8.1.10-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    <<: *restart
    # Docker Hub no longer serves minio/minio, so this is the Chainguard build.
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: *s3_access_key
      MINIO_ROOT_PASSWORD: *s3_secret_key
    depends_on:
      minio-init:
        condition: service_completed_successfully
    volumes:
      - minio-data:/data
    # No published port. Browsers reach MinIO through the proxy on the public URL,
    # and the other services reach it over the compose network.
    expose:
      - "9000"

  minio-init:
    # MinIO serves every top-level directory of its data volume as a bucket, so this creates the
    # bucket "artel" on first start and exits. The bucket name must not be api, oauth2, login, ws,
    # assets, projects or account: the proxy routes those paths to the console and the API.
    # 65532 is the user the MinIO image runs as.
    image: busybox:1.37
    command: ["sh", "-c", "mkdir -p /data/artel && chown 65532:65532 /data/artel"]
    volumes:
      - minio-data:/data

  orchestration:
    <<: *restart
    image: ghcr.io/project-artel/orchestration:develop
    build:
      context: ../artel-orchestration-server
      dockerfile: ../deploy/Dockerfile.orchestration
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: artel
      DB_USERNAME: artel
      DB_PASSWORD: *db_password
      DB_SSL_MODE: disable
      REDIS_URL: redis://redis:6379
      ARTEL_INTERNAL_API_PORT: "8081"
      # The agent server serves every route under /internal, and the clients append /extract, /embed,
      # /sessions and so on to this base URL, so the prefix belongs here.
      ARTEL_AGENT_BASE_URL: http://agent-server:8000/internal
      ARTEL_AGENT_WS_BASE_URL: ws://agent-server:8000/internal
      # The server's application.yml sets org.springframework.web to DEBUG, which logs a line for every
      # request including each 401, 403 and 404. Keep production logs at INFO.
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB_REACTIVE: INFO
      # The console origin is always allowed; this adds the admin page.
      ARTEL_HOME_URL: *public_url
      ARTEL_ALLOWED_ORIGINS: *admin_url
      ARTEL_JWT_SECRET: *jwt_secret
      ARTEL_SECRETS_KEY: *secrets_key
      # Set to true only when the public URL is https, so cookies are sent over TLS only.
      ARTEL_SECURE_COOKIE: "false"
      # The first account to sign up becomes the admin. After that, public signup is closed unless true.
      ARTEL_SIGNUP_OPEN: "false"
      # With false, a GitHub account signs in only when an admin created a user with the same email.
      ARTEL_GITHUB_SIGNUP_OPEN: "false"
      # Login rate limit: failures per email or per client address inside the window before a 429.
      ARTEL_LOGIN_MAX_FAILURES: "10"
      ARTEL_LOGIN_FAILURE_WINDOW: PT15M
      ARTEL_LOGIN_ADDRESS_MAX_FAILURES: "100"
      OPENROUTER_API_KEY: *openrouter_api_key
      # Optional GitHub login. The button is hidden unless both are set.
      # Callback URL: <public URL>/login/oauth2/code/github
      GITHUB_CLIENT_ID: ""
      GITHUB_CLIENT_SECRET: ""
      ARTEL_S3_BUCKET: artel
      ARTEL_S3_REGION: us-east-1
      # The server's own S3 calls go to MinIO over the compose network. Presigned URLs that the browser
      # opens are written for the public URL, and the proxy forwards /artel/ to MinIO unchanged.
      ARTEL_S3_ENDPOINT: http://minio:9000
      ARTEL_S3_PRESIGN_ENDPOINT: *public_url
      ARTEL_S3_ACCESS_KEY: *s3_access_key
      ARTEL_S3_SECRET_KEY: *s3_secret_key
    # 8080 is reached only through the reverse proxy and 8081 only from this network.
    expose:
      - "8080"
      - "8081"

  agent-server:
    <<: *restart
    image: ghcr.io/project-artel/agent:develop
    build:
      context: ../artel-agent-server
      target: runtime
    environment:
      APP_PORT: "8000"
      APP_ENV: production
      # The key from the admin page wins; this is the fallback.
      OPENROUTER_API_KEY: *openrouter_api_key
      # Internal port: the unauthenticated /internal/** API, reached only over the compose network.
      ORCHESTRATION_BASE_URL: http://orchestration:8081
      LANGSMITH_TRACING: "false"
    expose:
      - "8000"

  admin-page:
    <<: *restart
    image: ghcr.io/project-artel/admin:main
    environment:
      # The container replaces a placeholder in the bundle with these at start.
      VITE_ORCHESTRATION_URL: *admin_url
      VITE_HOME_URL: *public_url
    expose:
      - "8080"

  artel-home:
    <<: *restart
    image: ghcr.io/project-artel/console:develop
    environment:
      VITE_ORCHESTRATION_URL: *public_url
    expose:
      - "8080"

  proxy:
    <<: *restart
    image: caddy:2-alpine
    depends_on:
      - orchestration
      - admin-page
      - artel-home
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    # Host ports: console, TLS (used only when a Caddy site address is a host name), admin page.
    ports:
      - "8088:80"
      - "8443:443"
      - "8090:8090"

# Caddy configuration. It cannot read the values at the top, so edit the ports above and the public URL together.
# A host name instead of :80 or :8090 makes Caddy fetch a TLS certificate. The two sites are two origins
# because each frontend image serves its bundle from the root path; each browser calls only its own origin.
# The orchestration internal port 8081 is deliberately not routed.
configs:
  caddyfile:
    content: |
      :80 {
        encode zstd gzip

        # Presigned upload and download URLs go straight to MinIO. They are signed over the exact path
        # and Host header, so this route must not rewrite either.
        handle /artel/* {
          reverse_proxy minio:9000
        }

        @orchestration path /api/* /oauth2/* /login/oauth2/* /ws/*
        handle @orchestration {
          # flush_interval -1 keeps server-sent event streams from being buffered.
          reverse_proxy orchestration:8080 {
            flush_interval -1
          }
        }

        handle {
          reverse_proxy artel-home:8080
        }
      }

      :8090 {
        encode zstd gzip

        @orchestration path /api/* /oauth2/* /login/oauth2/* /ws/*
        handle @orchestration {
          reverse_proxy orchestration:8080 {
            flush_interval -1
          }
        }

        handle {
          reverse_proxy admin-page:8080
        }
      }


volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
